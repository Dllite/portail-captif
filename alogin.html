<!DOCTYPE html>
<html lang="en">
<head>

    $(if refresh-timeout)
    <meta http-equiv="refresh" content="$(refresh-timeout-secs)">
    $(endif)
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Mikrotik Hotspot Login page</title>

    <!-- Bootstrap core CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/font-awesome.css" rel="stylesheet">
    <!-- Bootstrap theme -->
    <link href="/css/bootstrap-theme.css" rel="stylesheet">

    <style>
        .outer {
            display: table;
            position: absolute;
            height: 100%;
            width: 100%;
        }

        .middle {
            display: table-cell;
            vertical-align: middle;
        }

        .inner {
            margin-left: auto;
            margin-right: auto;
            width: 400px;
        }
    </style>
    <script language="JavaScript">
        <!--
        function startClock() {
            $(if popup == 'true')
                open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
            $(endif)
            location.href = '$(link-redirect)';
        }
        //-->
    </script>

</head>

<body role="document" onLoad="startClock()">
    <div class="container">
        <div class="language-switcher" style="text-align:right; margin-top:20px;">
            <button class="btn btn-primary btn-lang active" onclick="switchLanguage('fr')">Français</button>
            <button class="btn btn-primary btn-lang" onclick="switchLanguage('en')">English</button>
        </div>
    </div>


<div class="container theme-showcase" role="main">

    <div class="outer middle inner">

        <table width="100%" height="100%">
            <tr>
                <td align="center" valign="middle">
                    <h3 lang="en">You are logged in</h3>
                    <h3 lang="fr" style="display:none">Vous êtes connecté</h3>
                    <p><i class="fa fa-spinner fa-spin fa-4x"></i> </p>
                    <a  class="btn btn-default" href="$(link-redirect)" lang="en">If nothing happens, click here</a>
                    <a  class="btn btn-default" href="$(link-redirect)" lang="fr" style="display:none">Si rien ne se passe, cliquez ici</a>
                </td>
            </tr>
        </table>
    </div>



</div> <!-- /container -->

    <div class="contact">
        <p lang="fr"><strong>Support client :</strong> +237 681 230 857 / +237 655 853 348</p>
        <!-- <p lang="en" style="display:none"><strong>Customer support:</strong> +237 691 15 22 35</p> -->
        <!-- <p lang="fr"><strong>Email :</strong> contact@wifi-zone.com</p> -->
        <!-- <p lang="en" style="display:none"><strong>Email:</strong> contact@wifi-zone.com</p> -->
    </div>

    <div class="powered-by">
        <p lang="fr">Powered by <span class="dllite">DL LITE LABS</span></p>
        <p lang="en" style="display:none">Powered by <span class="dllite">DL LITE LABS</span></p>
    </div>


<!-- Bootstrap core JavaScript
================================================== -->
<!-- Placed at the end of the document so the pages load faster -->
<script src="/js/jquery-1.12.2.min.js"></script>
<script>window.jQuery || document.write('<script src="/js/jquery-1.12.2.min.js"><\/script>')</script>
<script src="/js/bootstrap.min.js"></script>
<script>
    // Système de changement de langue inspiré de login.html
    let currentLang = 'fr';
    function switchLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('[lang]').forEach(el => {
            el.style.display = 'none';
        });
        document.querySelectorAll('[lang="'+lang+'"]').forEach(el => {
            el.style.display = '';
        });
        document.querySelectorAll('.btn-lang').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent.toLowerCase().includes(lang === 'fr' ? 'français' : 'english')) {
                btn.classList.add('active');
            }
        });
    }
    document.addEventListener('DOMContentLoaded', function() {
        switchLanguage('fr');
    });
</script>
</body>
</html>
