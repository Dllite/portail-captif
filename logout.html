<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Déconnexion - Hotspot</title>
    <style>
        :root {
            --primary: #8bc34a;
            --secondary: #0b2341;
            --light: #f8fafd;
            --dark: #222;
        }
        body {
            font-family: 'Segoe UI', Arial, Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .center-container {
            max-width: 410px;
            margin: 32px auto 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(44,62,80,0.13);
            padding: 24px 12px 18px 12px;
            position: relative;
        }
        .logo {
            display: block;
            margin: 0 auto 12px auto;
            max-width: 90px;
        }
        .logout-title {
            text-align: center;
            font-size: 21px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
        }
        .logout-msg {
            text-align: center;
            font-size: 16px;
            color: #222;
            margin-bottom: 18px;
        }
        .btn-return {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            padding: 13px 0;
            margin-bottom: 10px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(139,195,74,0.10);
            transition: background 0.18s, box-shadow 0.18s;
        }
        .btn-return:hover {
            background: #6fa13a;
            box-shadow: 0 4px 16px rgba(139,195,74,0.16);
        }
        .about-box {
            background:rgba(255,255,255,0.97);
            border-radius:12px;
            box-shadow:0 1px 6px rgba(44,62,80,0.07);
            margin:18px 0 10px 0;
            padding:14px 10px;
        }
        .about-box a { color: var(--secondary); }
        .footer {
            text-align:center;
            font-size:13px;
            color:#222;
            margin:10px 0 0 0;
        }
        .footer a {
            color:var(--secondary);
            font-weight:700;
            text-decoration:underline;
        }
        @media (max-width: 600px) {
            .center-container {
                margin: 6px;
                padding: 7px 2px 10px 2px;
            }
            .logout-title {
                font-size: 17px;
            }
            .about-box { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="center-container">
        <img src="img/monique_ntumngia.jpg" width="100" height="100" alt="Logo" class="logo">
        <div class="logout-title">Vous êtes déconnecté</div>
        <div class="logout-msg">Merci d'avoir utilisé notre service.<br>À bientôt !</div>
        <a href="login.html" class="btn-return">Retour à la connexion</a>
        <div class="about-box" style="background:rgba(255,255,255,0.97); border-radius:14px; box-shadow:0 2px 10px rgba(44,62,80,0.07); margin:28px 0 18px 0; padding:22px 18px;">
            <div style="font-size:20px; font-weight:700; margin-bottom:10px; letter-spacing:0.5px;">QUI SOMMES-NOUS ?</div>
            <div style="font-size:16px; margin-bottom:16px;">Nous sommes </div>
            <div style="font-size:17px; font-weight:700; margin-bottom:4px;">LOCALISATION</div>
            <div style="font-size:16px; margin-bottom:16px;">Douala - Kotto : Carrefour TamTam Weekend.</div>
            <div style="font-size:17px; font-weight:700; margin-bottom:4px;">CONTACT</div>
            <div style="font-size:16px; margin-bottom:0;"><a href="tel:+237655853348" style="color:#0b2341; text-decoration:underline;"> +237 6 81 23 08 47 / +237 6 55 85 33 48</a></div>
        </div>
        <div class="footer">
            <div style="margin-bottom:2px;">Copyright © 2025 by AUDSTORE SARL</div>
            <div>Powered by <a href="#">Vivien FOPPA</a></div>
        </div>
    </div>
</body>
</html>
