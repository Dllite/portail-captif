<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Déconnexion - StarLink WiFi Zone</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #dc2626;
            --light: #f8fafd;
            --dark: #1f2937;
            --accent: #f59e0b;
            --success: #059669;
        }
        body {
            font-family: 'Segoe UI', Arial, Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .center-container {
            max-width: 450px;
            margin: 32px auto 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 35px 30px 30px 30px;
            position: relative;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .brand-name {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .brand-tagline {
            font-size: 15px;
            color: #6b7280;
            font-weight: 500;
        }
        .logout-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .logout-msg {
            text-align: center;
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-return {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            padding: 15px 0;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-return:hover {
            background: #1e40af;
            box-shadow: 0 6px 20px rgba(30, 58, 138, 0.3);
            transform: translateY(-2px);
        }
        .support-section {
            background: linear-gradient(135deg, #f8fafd 0%, #e2e8f0 100%);
            border-radius: 15px;
            padding: 20px 15px;
            margin: 25px 0 15px 0;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .support-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--primary);
        }
        .support-phone {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }
        .support-phone a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
        .support-phone a:hover {
            text-decoration: underline;
        }
        .footer {
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            margin: 20px 0 0 0;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }
        .footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .center-container {
                margin: 15px;
                padding: 25px 20px 20px 20px;
            }
            .brand-name {
                font-size: 22px;
            }
            .logout-title {
                font-size: 20px;
            }
            .support-section {
                padding: 15px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="center-container">
        <div class="brand-header">
            <div class="brand-name">StarLink WiFi Zone</div>
            <div class="brand-tagline">Connexion Internet Haute Vitesse</div>
        </div>
        
        <div class="logout-title">Vous êtes déconnecté</div>
        <div class="logout-msg">Merci d'avoir utilisé notre service.<br>À bientôt !</div>
        
        <a href="login.html" class="btn-return">Retour à la connexion</a>
        
        <div class="support-section">
            <div class="support-title">Support Technique</div>
            <div class="support-phone">
                <a href="tel:+237698250701">+237 698 250 701</a>
            </div>
            <div style="font-size:13px; color:#6b7280; margin-top:6px;">
                Assistance disponible 24h/24
            </div>
        </div>
        
        <div class="footer">
            <div style="margin-bottom:3px;">StarLink WiFi Zone</div>
            <div>© 2025 - Service Internet Professionnel</div>
        </div>
    </div>
</body>
</html>
